name: Android bootstrap

on:
  push:
    branches:
      - android-port-bootstrap
    paths:
      - "android/**"
      - ".github/workflows/android-bootstrap.yml"
  workflow_dispatch:

jobs:
  rexglue-arm64-configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The pinned SDK revision has one stale gitlink without a URL.
          # android/prepare-rexglue.sh initializes the valid SDK dependencies.
          submodules: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.31.1"

      - name: Prepare ReXGlue Android tree
        shell: bash
        run: ./android/prepare-rexglue.sh

      - name: Configure ReXGlue for arm64-v8a
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          "$ANDROID_HOME/cmake/3.31.1/bin/cmake" \
            -S rexglue-sdk \
            -B build/rexglue-android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DREXGLUE_ENABLE_FIDELITYFX=OFF \
            -DREXGLUE_USE_D3D12=OFF \
            -DREXGLUE_USE_VULKAN=ON

      - name: Compile Android core and UI
        shell: bash
        run: |
          "$ANDROID_HOME/cmake/3.31.1/bin/cmake" \
            --build build/rexglue-android \
            --target rexcore rexui \
            --parallel 2
