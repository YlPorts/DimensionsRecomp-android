name: Android bootstrap

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - android-port-bootstrap
    paths:
      - "android/prepare-rexglue.sh"
      - "android/patches/**"
      - "android/app/src/main/cpp/android_gamepad.cpp"
      - "android/app/src/main/cpp/android_gamepad.h"
      - ".github/workflows/android-bootstrap.yml"
  workflow_dispatch:

jobs:
  rexglue-arm64-configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          SDKMANAGER="$(
            find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print |
              sort -V |
              tail -n 1
          )"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.31.1"

      - name: Prepare ReXGlue Android tree
        shell: bash
        run: ./android/prepare-rexglue.sh

      - name: Compile touch-controller JNI bridge
        shell: bash
        run: |
          CXX="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          "$CXX" -std=c++23 -fPIC -Wall -Wextra -Werror \
            -Irexglue-sdk/thirdparty/sdl3/include \
            -Iandroid/app/src/main/cpp \
            -c android/app/src/main/cpp/android_gamepad.cpp \
            -o /tmp/android_gamepad.o

      - name: Configure ReXGlue for arm64-v8a
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          "$ANDROID_HOME/cmake/3.31.1/bin/cmake" \
            -S rexglue-sdk \
            -B build/rexglue-android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DREXGLUE_ENABLE_FIDELITYFX=OFF \
            -DREXGLUE_USE_D3D12=OFF \
            -DREXGLUE_USE_VULKAN=ON

      - name: Compile Android runtime and Xenos Vulkan renderer
        shell: bash
        run: |
          "$ANDROID_HOME/cmake/3.31.1/bin/cmake" \
            --build build/rexglue-android \
            --target rexcore rexui rexgpu-xenos \
            --parallel 2
