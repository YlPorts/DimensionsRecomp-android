name: Android host codegen

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - android-port-bootstrap
    paths:
      - "android/generate-guest.sh"
      - "android/build-from-dump.sh"
      - "android/prepare-rexglue.sh"
      - "android/patches/**"
      - ".github/workflows/android-host-codegen.yml"
  workflow_dispatch:

jobs:
  codegen-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install native build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 ninja-build libc++-18-dev libc++abi-18-dev libx11-xcb-dev libwayland-dev

      - name: Validate Android helper scripts
        shell: bash
        run: |
          bash -n android/generate-guest.sh
          bash -n android/build-from-dump.sh
          bash -n android/build-android.sh
          bash -n android/prepare-rexglue.sh

      - name: Prepare patched ReXGlue tree
        shell: bash
        run: ./android/prepare-rexglue.sh

      - name: Configure native rexglue CLI
        shell: bash
        run: |
          cmake -S rexglue-sdk -B build/rexglue-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++" \
            -DCMAKE_SHARED_LINKER_FLAGS="-stdlib=libc++" \
            -DREXGLUE_BUILD_TOOLS=ON \
            -DREXGLUE_BUILD_TESTS=OFF \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DREXGLUE_ENABLE_FIDELITYFX=OFF \
            -DREXGLUE_ENABLE_DESKTOP_SDL_BACKENDS=OFF \
            -DREXGLUE_USE_VULKAN=ON

      - name: Build and run rexglue CLI
        shell: bash
        run: |
          cmake --build build/rexglue-host --target rexglue --parallel 2
          REXGLUE="$(find rexglue-sdk/out -type f -perm -111 -name rexglue -print -quit)"
          test -x "$REXGLUE"
          "$REXGLUE" --help
