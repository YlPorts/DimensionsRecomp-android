name: Android APK smoke

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - android-port-bootstrap
    paths:
      - "android/app/**"
      - "android/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "android/gradle.properties"
      - "android/prepare-rexglue.sh"
      - "android/patches/**"
      - "rexlego/src/**"
      - ".github/workflows/android-apk-smoke.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          SDKMANAGER="$(
            find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print |
              sort -V |
              tail -n 1
          )"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.31.1"

      - name: Prepare ReXGlue Android tree
        shell: bash
        run: ./android/prepare-rexglue.sh

      - name: Build host-smoke APK
        shell: bash
        run: |
          gradle -p android :app:assembleDebug -PrexHostSmoke=true --stacktrace

      - name: Verify native libraries in APK
        shell: bash
        run: |
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | tee /tmp/apk-contents.txt
          grep -q 'lib/arm64-v8a/libmain.so' /tmp/apk-contents.txt
          grep -q 'lib/arm64-v8a/librexruntime.so' /tmp/apk-contents.txt
          grep -q 'lib/arm64-v8a/librexgpu-xenos.so' /tmp/apk-contents.txt
          grep -q 'lib/arm64-v8a/libc++_shared.so' /tmp/apk-contents.txt

      - name: Upload smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: dimensions-android-host-smoke
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
