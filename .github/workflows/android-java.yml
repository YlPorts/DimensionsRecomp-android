name: Android Java shell

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - android-port-bootstrap
    paths:
      - "android/app/src/main/java/**"
      - "android/app/src/main/AndroidManifest.xml"
      - ".github/workflows/android-java.yml"
  workflow_dispatch:

jobs:
  javac:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Initialize SDL3 Java sources
        shell: bash
        run: |
          git submodule update --init rexglue-sdk
          git -C rexglue-sdk submodule update --init thirdparty/sdl3

      - name: Compile Java shell against Android API 35
        shell: bash
        run: |
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_JAR"
          mkdir -p build/android-java
          find android/app/src/main/java \
               rexglue-sdk/thirdparty/sdl3/android-project/app/src/main/java \
               -name '*.java' -print > build/android-java/sources.txt
          javac \
            -source 17 -target 17 \
            -cp "$ANDROID_JAR" \
            -d build/android-java/classes \
            @build/android-java/sources.txt
